name: Build Sync Desk — Windows

on:
  workflow_dispatch:        # lanzar manualmente desde GitHub Actions
  push:
    tags:
      - "sync-desk-v*"      # o al hacer push de un tag: git tag sync-desk-v1.0.0 && git push --tags

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: sync-desk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sync-desk/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync-desk/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sync-desk
          tauriScript: npx tauri

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sync-desk-windows
          path: |
            sync-desk/src-tauri/target/release/bundle/msi/*.msi
            sync-desk/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30
