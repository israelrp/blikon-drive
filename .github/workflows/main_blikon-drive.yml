name: Deploy API → Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'BlikonDrive.Api/**'
      - 'BlikonDrive.Core/**'
      - 'BlikonDrive.Infrastructure/**'
      - '.github/workflows/main_blikon-drive.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore BlikonDrive.Api/BlikonDrive.Api.csproj

      - name: Publish API
        run: |
          dotnet publish BlikonDrive.Api/BlikonDrive.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-self-contained \
            --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'blikon-drive'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_154982CC42484FEAA81855546F6A3339 }}
