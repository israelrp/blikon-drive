[package]
name = "blikon-sync-desk"
version = "0.1.0"
description = "Blikon Drive Sync Desktop App"
authors = ["Blikon"]
edition = "2021"

[lib]
name = "blikon_sync_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blikon-sync-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
notify = "6"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
mime_guess = "2"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
block2           = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString"] }
objc2-web-kit    = { version = "0.3", features = ["WKWebView", "WKHTTPCookieStore", "WKWebsiteDataStore", "WKWebViewConfiguration"] }
